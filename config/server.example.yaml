# relay-htcp server configuration

# Listen address for the public endpoint. Defaults to :5630 when omitted;
# the server's -listen / -port flags override it for a single run.
listen: ":5630"

# TLS certificate. If omitted, the server listens in cleartext (h2c) —
# intended for LAN use and tests only.
tls:
  cert: "server.crt"
  key: "server.key"

# Authenticated client identities. A token may reference several routes
# (multi-select in the admin panel). An empty routes list still means
# "all routes", which is not recommended.
auth:
  tokens:
    - name: office-laptop
      token: "change-me-please-0123456789"
      routes: [ssh, mysql]
    - name: ops
      token: "another-change-me-0123456789"
      routes: [mysql]

# Local targets exposed through the tunnel.
routes:
  - name: ssh
    target: "127.0.0.1:22"
  - name: mysql
    target: "127.0.0.1:3306"

tunnel:
  max_concurrent_streams: 128   # per HTTP/2 connection
  max_connections: 100          # 0 = unlimited
  dial_timeout: 10s             # target dial timeout
  idle_timeout: 90s             # drop a silent control stream
  xhttp_path: "/relay"          # CDN/xhttp endpoint prefix; /relay avoids colliding with Xray

# Camouflage: decoy page for scanners, nginx-style Server header.
disguise:
  enabled: true

log:
  level: info   # debug | info | warn | error

# Embedded admin panel (user login + live status + config editing).
# Shared mode mounts the panel on the tunnel listener, so externally there is
# only one web service. `path` is the URL prefix (pick something unguessable)
# and `allowed_cidrs` keeps the login page off the public internet. Use TLS
# whenever the tunnel port is reachable from untrusted networks.
# With shared: false the panel opens its own listener on `listen` instead.
# On first run a default user is created; with an empty default_password a
# random initial password is printed to the log exactly once. Configs saved
# from the panel live in the SQLite DB and win over this file on restart.
admin:
  enabled: false
  shared: true
  path: "/admin"                # change to an unguessable prefix in production
  allowed_cidrs: ["0.0.0.0/0", "::/0"]  # 默认全部放行；可在“IP 访问”页限制
  # listen: "127.0.0.1:8080"   # standalone mode only
  db_path: "data/admin.db"
  key_file: "data/admin.db.key"  # master key for at-rest encryption; auto-created 0600
  default_username: "admin"
  default_password: ""        # empty = generate and print once on first run
  session_ttl: 24h
  # token: ""                 # optional static bootstrap token for scripts
