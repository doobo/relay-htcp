# relay-htcp client configuration

# Global defaults. Each servers[] entry may override token and CA.
auth:
  token: "change-me-please-0123456789"

tls:
  insecure_skip_verify: false   # true only for self-signed certificates
  ca_file: ""                   # optional custom CA bundle (PEM)

# Optional outbound proxy used to reach the tunnel servers. Disabled by
# default. HTTP proxies use CONNECT and therefore require https:// server URLs;
# SOCKS5 works for both http:// (h2c) and https://.
proxy:
  enabled: false
  type: http                    # http | socks5
  address: "127.0.0.1:7890"     # host:port
  username: ""
  password: ""

# One or more tunnel servers. Each server gets its own connection pool.
servers:
  - name: primary
    url: "https://tunnel.example.com:443"
    transport: http             # http = direct end-to-end HTTP/2; xhttp = CDN/Cloudflare
    # token: ""                 # empty = auth.token
    # ca_file: ""               # empty = tls.ca_file
    # insecure_skip_verify: false
  # - name: cloudflare
  #   url: "https://ws.example.com"
  #   transport: xhttp          # split upload POST + download GET; works behind CDN
  #   xhttp_path: "/relay"      # must match the server's tunnel.xhttp_path
  #   token: "another-token"    # optional per-server token

# Legacy single-server form is still accepted and migrated on load:
# server: "https://tunnel.example.com:443"

# Local ports mapped to server-side routes. A listener may select one or more
# servers and a strategy:
#   failover     = always use the first selected server; fall back to the next
#                  one when it is unreachable or a stream cannot be opened
#   round_robin  = rotate over the selected servers
listeners:
  - local: "127.0.0.1:2222"
    target: "ssh"
    servers: [primary]
    strategy: failover
  - local: "127.0.0.1:33060"
    target: "mysql"
    servers: [primary]          # empty = all configured servers
    strategy: round_robin

tunnel:
  connections: 2          # per server: independent tunnel connections
  heartbeat: 15s          # PING interval
  heartbeat_miss: 3       # consecutive missed PONGs before reconnect
  reconnect_min: 1s
  reconnect_max: 30s
  stream_timeout: 30s     # max wait for a live tunnel on accept

# Browser-like request headers to camouflage tunnel traffic.
disguise:
  enabled: true
  user_agent: ""          # empty = built-in Chrome UA

log:
  level: info

# Embedded admin panel (user login + live status + config editing).
# The client has no inbound tunnel port, so its panel always uses its own
# listener. `path` is the URL prefix of the panel.
# On first run a default user is created; with an empty default_password a
# random initial password is printed to the log exactly once. Configs saved
# from the panel live in the SQLite DB and win over this file on restart.
admin:
  enabled: false
  path: "/admin"
  listen: "127.0.0.1:15630"
  db_path: "data/admin.db"
  key_file: "data/admin.db.key"  # master key for at-rest encryption; auto-created 0600
  default_username: "admin"
  default_password: ""        # empty = generate and print once on first run
  session_ttl: 24h
  # token: ""                 # optional static bootstrap token for scripts
